<!DOCTYPE html>

<head>
	<title> LiveScore </title>
	<link rel="stylesheet" href="css/LiveScoreStyle.css" type="text/css">
	<script src="js/jquery-3.1.1.min.js"></script>
</head>

<body>
	<div id="background" style="
		background: url(assets/cave.png) center center / 150% no-repeat;
		height: 1080px;
		background-position-y: -150px;
	"> </div>

	<div class="main" id="main"> <!--Makes everything in this div part of the main body-->
		<div id="centered" style="
		font-size: 150%;
		">
			<h2 id="matchNum">Match #: </h2> <!--Add in header for Match#-->
			<div>
				<div id="blueSide"> <!--Groups entire blue side-->
					<div class="spacer"> </div> <!--Spacer-->
					<div class="team"> <!--Groups blue teams-->
						<h3 class="blueTeam" id="blue1" style="color: blue;">Blue 1:123</h3>
						<h3 class="blueTeam" id="blue2" style="color: blue;">Blue 2:123</h3>
						<h3 class="blueTeam" id="blue3" style="color: blue;">Blue 3:123</h3>
					</div>
					<div>
						<h3 class="score" id="blueScore">50</h3> <!--Adds score-->
					</div>
				</div>
			</div>
			<div id="redSide">
				<div class="spacer"> </div>
				<div class="team">
					<h3 class="redTeam" id="red1" style="color: red;">Red 1:123</h3>
					<h3 class="redTeam" id="red2" style="color: red">Red 2:123</h3>
					<h3 class="redTeam" id="red3" style="color: red">Red 3:123</h3>
				</div>
				<div>
					<h3 class="score" id="redScore"> 50</h3>
				</div>
			</div>

			<h2 id="time"> Time : 2:15 </h2>
		</div>
		<!-- Put this RIGHT BEFORE the closing </div> of <div class="main" id="main"> -->
	<div id="ScoreReveal">
		<div style="padding-bottom: 50px;">
			<h2 id="matchNum">Match #:</h2>
		</div>
    <div class="alliances">
        <!-- Red -->
        <div class="alliance red">
            <div class="alliance-name">RED ALLIANCE</div>
            <div class="teams" id="redTeams"></div>

            <div class="final-score">
                FINAL <span id="redGrandTotal" class="score-value">0</span>
            </div>

            <div class="breakdown">
                <div class="category">
                    <h3>AUTO</h3>
                    <div id="redAutoBreakdown" class="details"></div>
                </div>
                <div class="category">
                    <h3>TELEOP</h3>
                    <div id="redTeleBreakdown" class="details"></div>
                </div>
                <div class="category">
                    <h3>ENDGAME</h3>
                    <div id="redEndBreakdown" class="details"></div>
					<hr>
					<h3>PENALITIES</h3>
					<div id="redPenaltiesBreakdown" class="details"></div>
                </div>
            </div>
        </div>

        <!-- Blue -->
        <div class="alliance blue">
            <div class="alliance-name">BLUE ALLIANCE</div>
            <div class="teams" id="blueTeams"></div>

            <div class="final-score">
                FINAL <span id="blueGrandTotal" class="score-value">0</span>
            </div>

            <div class="breakdown">
                <div class="category">
                    <h3>AUTO</h3>
                    <div id="blueAutoBreakdown" class="details"></div>
                </div>
                <div class="category">
                    <h3>TELEOP</h3>
                    <div id="blueTeleBreakdown" class="details"></div>
                </div>
                <div class="category">
                    <h3>ENDGAME</h3>
                    <div id="blueEndBreakdown" class="details"></div>
					<hr>
					<h3>PENALITIES</h3>
					<div id="bluePenaltiesBreakdown" class="details"></div>
                </div>
            </div>
        </div>
    </div>
</div>
	</div>
	<!-- <div id="Videos" style="height:100%">
			<video id = "RedWin" width="100%" height="100%" muted >
				<source src="./Videos/JRL winner video - red.mp4" type="video/mp4">
			</video> 
			<video id = "BlueWin" width="100%" height="100%" muted >
				<source src="./Videos/JRL winner video - blue.mp4" type="video/mp4">
			</video> 
			<video id = "Tie" width="100%" height="100%" muted >
				<source src="./Videos/JRL winner video - tie.mp4" type="video/mp4">
			</video> 
		</div> -->
	<!-- Put this RIGHT BEFORE the closing </div> of <div class="main" id="main"> -->
	</div>
	<script type="text/javascript" src="js/scoreCalc.js"></script>
	<script type="text/javascript" src="js/LiveScoreScript.js"></script>
</body>


<head>
    <meta http-equiv="Content-Type" content="text/html; charset=utf8" />
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0" />
    <link rel="stylesheet" type="text/css" href="css/Scorer.css">
    <script src="js/jquery-3.1.1.min.js"></script>
</head>

 <body> 
    <div id="main">
        <div id="positionButtons">
            <select id="position_select">
                <option value="blue1">blue</option>
                <option value="red1">red</option>
             </select>
            <button id="reset">Reset</button>
			
            <button id="confirmBtn" class="confirmBtn">Confirm</button>
        </div>

        <div id="BlueSide" >
			<div style="background-color:#7af;text-align:center;">
			Blue
			</div>
			<div style="background-color:#7af;text-align:center;">
			Alliance
			</div>
			<div class="main-grid">
			
				<div class="AutoTitle">Auto</div>
				<div class="AutoSection">
					<div class="Label1">Mobility</div>
					<div class="Counter1">
						<div class="plusSubContainer" style="">
							<button class="Subbutton" id="blue_auto_mobSubButton" onclick="sub(this)" min="0">-</button>
							<div class="counterblue" id="blue_auto_mobCounter">00</div>
							<button class="plusbutton" id="blue_auto_mobAddButton" onclick="add(this)" max="3">+</button>
						</div>
					</div>
				</div>

				<div class="TeleTitle"style = "">Tele</div>
			
				<div class="Element1Side">
					<div class="Element1Title" style = "">Refinary</div>
					<div class="Counter1"> Ore
						<div class="plusSubContainer" style="">
							<button class="subButton" id="blue_tele_ore_refSubButton" onclick="sub(this)" min="0">-</button>
							<div class="counterBlue" id="blue_tele_ore_refCounter">00</div>
							<button class="plusButton" id="blue_tele_ore_refAddButton" onclick="add(this)" max="24">+</button>
						</div>
					</div>
						<div class="Counter2"> Diamond
						<div class="plusSubContainer" style="">
							<button class="subButton" id="blue_tele_diamond_refSubButton" onclick="sub(this)" min="0">-</button>
							<div class="counterBlue" id="blue_tele_diamond_refCounter">00</div>
							<button class="plusButton" id="blue_tele_diamond_refAddButton" onclick="add(this)" max="30">+</button>
						</div>
					</div>
				</div>
				<div class="Element2Side"> 
					<div class="Element2TItile"style = "">Depot</div>
					<div class="Counter1"> Ore
						<div class="plusSubContainer" style="">
							<button class="subButton" id="blue_tele_ore_depoSubButton" onclick="sub(this)" min="0">-</button>
							<div class="counterBlue" id="blue_tele_ore_depoCounter">00</div>
							<button class="plusButton" id="blue_tele_ore_depoAddButton" onclick="add(this)" max="24">+</button>
						</div>
					</div>
						<div class="Counter2"> Diamond
						<div class="plusSubContainer" style="">
							<button class="subButton" id="blue_tele_diamond_depoSubButton" onclick="sub(this)" min="0">-</button>
							<div class="counterBlue" id="blue_tele_diamond_depoCounter">00</div>
							<button class="plusButton" id="blue_tele_diamond_depoAddButton" onclick="add(this)" max="30">+</button>
						</div>
					</div>
				  </div>
				   
				<div class="EndTitle"style = "">Endgame</div>
	
				<div id="BlueEndgame" class="Endgame">
					<div class="EndGameRobot1Label">Robot 1</div>
					<button class="RadioButton" id="_" onclick="RadioClick(this)" RadioGroup="Endgame1">None</button>
					<button class="RadioButton" id="blue_endgame_park" onclick="RadioClick(this)" RadioGroup="Endgame1">Park</button>
					<button class="RadioButton" id="blue_endgame_climb" onclick="RadioClick(this)" RadioGroup="Endgame1">Climb</button>
					
					<div class="EndGameRobot2Label">Robot 2</div>
					<button class="RadioButton" id="_" onclick="RadioClick(this)" RadioGroup="Endgame2">None</button>
					<button class="RadioButton" id="blue_endgame_park" onclick="RadioClick(this)" RadioGroup="Endgame2">Park</button>
					<button class="RadioButton" id="blue_endgame_climb" onclick="RadioClick(this)" RadioGroup="Endgame2">Climb</button>
					
					<div class="EndGameRobot2Label">Robot 3</div>
					<button class="RadioButton" id="_" onclick="RadioClick(this)" RadioGroup="Endgame3">None</button>
					<button class="RadioButton" id="blue_endgame_park" onclick="RadioClick(this)" RadioGroup="Endgame3">Park</button>
					<button class="RadioButton" id="blue_endgame_climb" onclick="RadioClick(this)" RadioGroup="Endgame3">Climb</button>

				</div>
			</div>
		</div>
		
		
    </div>
	<script src="js/scorer.js"></script>
	
</body>

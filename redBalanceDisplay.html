<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Red Alliance Breakdown</title>
    <link rel="stylesheet" href="css/BalanceStyle.css">
    <script src="js/jquery-3.1.1.min.js"></script>
    <style>
        body { font-family: Arial; background:#111; color:white; text-align:center; }
        .breakdown { display:grid; grid-template-columns:repeat(2,1fr); gap:20px; max-width:1200px; margin:20px auto; }
        .section { background:#300; padding:15px; border-radius:10px; border:2px solid #f00; }
        table { width:100%; border-collapse:collapse; }
        th, td { padding:10px; border:1px solid #666; }
        th { background:#900; }
        .total { font-size:2.2em; color:gold; margin:15px 0; }
    </style>
</head>
<body>
    <h1>Red Alliance Breakdown - Match <span id="matchNum">0</span></h1>
    <div class="breakdown" id="redBreakdown"></div>

    <script src="js/redBalanceScript.js"></script>
</body>
</html>
